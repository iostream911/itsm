# ==========================================
# ITSM 应用配置
# ==========================================
image:
  repository: harbor.szctdg.tech/itsm/itsm
  tag: v1.2.4
  pullPolicy: Always

replicas: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 1Gi

service:
  type: NodePort
  port: 3000
  nodePort: 30081

ingress:
  host: itsm.172.24.16.40.nip.io

readinessProbe:
  path: /login.html
  port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10

imagePullSecrets:
  - name: harbor-registry

config:
  TZ: Asia/Shanghai
  ZAMMAD_URL: "http://zammad-railsserver:3000"

secrets: {}

# ==========================================
# Zammad 应用层 (railsserver, scheduler, websocket)
# ==========================================
zammad-app:
  enabled: true
  image: ghcr.io/zammad/zammad:7.0.1-0024
  railsserver:
    replicas: 3
    workers: 4        # WEB_CONCURRENCY，每个 Pod 的 Puma worker 数
    maxThreads: 16    # 每个 worker 的线程数
    dbPool: 80        # DATABASE_POOL，匹配总线程数
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 3Gi
  scheduler:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
  websocket:
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# ==========================================
# Zammad 基础设施 (DB, Redis, Memcached, ES, PVC)
# ==========================================
zammad-infra:
  enabled: true
  postgresql:
    image: postgres:17.9-alpine
    storage: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 2
        memory: 2Gi
  redis:
    image: redis:8.6.2-alpine
    storage: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  memcached:
    image: memcached:1.6.41-alpine
    maxMemory: "256M"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  elasticsearch:
    image: harbor.szctdg.tech/itsm/elasticsearch:7.17.25-plugin
    javaOpts: "-Xms1g -Xmx1g"
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi
  storage:
    size: 5Gi
  backup:
    size: 5Gi
