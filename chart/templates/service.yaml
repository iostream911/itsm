apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
  {{- if eq .Values.service.type "NodePort" }}
  - nodePort: {{ .Values.service.nodePort }}
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
  {{- else }}
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
  {{- end }}
  selector:
    app: {{ .Release.Name }}
