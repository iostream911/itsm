{{- if index .Values "zammad-infra" "enabled" -}}
---
# Zammad ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: zammad-config
  namespace: {{ .Release.Namespace }}
data:
  POSTGRESQL_HOST: zammad-postgresql
  POSTGRESQL_DB: zammad_production
  POSTGRESQL_USER: zammad
  POSTGRESQL_PASS: zammad
  REDIS_URL: redis://zammad-redis:6379
  MEMCACHE_SERVERS: zammad-memcached:11211
  ELASTICSEARCH_ENABLED: "true"
  ELASTICSEARCH_URL: "http://zammad-elasticsearch:9200"
  NGINX_PORT: "8080"
  TZ: Asia/Shanghai
  ZAMMAD_RAILSSERVER_PORT: "3000"
  ZAMMAD_WEBSOCKET_PORT: "6042"
  ZAMMAD_HTTP_TYPE: "IPv4"
  DATABASE_POOL: "40"
  MAX_THREADS: "16"
  WEB_CONCURRENCY: "2"
  RAILS_SERVE_STATIC_FILES: "true"
  RAILS_ACTION_CABLE_ALLOWED_REQUEST_ORIGINS: "http://172.24.16.40:30082,http://localhost:30082"
  ZAMMAD_ALLOWED_HOSTS: "172.24.16.40,localhost"
  ZAMMAD_WEBSOCKET_ALLOWED_ORIGINS: "http://172.24.16.40:30082,http://localhost:30082"
---
# PVCs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zammad-postgresql-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ index .Values "zammad-infra" "postgresql" "storage" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zammad-redis-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ index .Values "zammad-infra" "redis" "storage" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zammad-storage-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ index .Values "zammad-infra" "storage" "size" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zammad-backup-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ index .Values "zammad-infra" "backup" "size" }}
---
# PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-postgresql
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zammad-postgresql
  template:
    metadata:
      labels:
        app: zammad-postgresql
    spec:
      containers:
      - name: postgresql
        image: {{ index .Values "zammad-infra" "postgresql" "image" }}
        env:
        - name: POSTGRES_DB
          value: zammad_production
        - name: POSTGRES_USER
          value: zammad
        - name: POSTGRES_PASSWORD
          value: zammad
        ports:
        - containerPort: 5432
        resources:
          requests:
            cpu: {{ index .Values "zammad-infra" "postgresql" "resources" "requests" "cpu" }}
            memory: {{ index .Values "zammad-infra" "postgresql" "resources" "requests" "memory" }}
          limits:
            cpu: {{ index .Values "zammad-infra" "postgresql" "resources" "limits" "cpu" }}
            memory: {{ index .Values "zammad-infra" "postgresql" "resources" "limits" "memory" }}
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: zammad-postgresql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-postgresql
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: zammad-postgresql
  ports:
  - port: 5432
    targetPort: 5432
---
# Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-redis
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zammad-redis
  template:
    metadata:
      labels:
        app: zammad-redis
    spec:
      containers:
      - name: redis
        image: {{ index .Values "zammad-infra" "redis" "image" }}
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: {{ index .Values "zammad-infra" "redis" "resources" "requests" "cpu" }}
            memory: {{ index .Values "zammad-infra" "redis" "resources" "requests" "memory" }}
          limits:
            cpu: {{ index .Values "zammad-infra" "redis" "resources" "limits" "cpu" }}
            memory: {{ index .Values "zammad-infra" "redis" "resources" "limits" "memory" }}
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: zammad-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: zammad-redis
  ports:
  - port: 6379
    targetPort: 6379
---
# Memcached
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-memcached
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zammad-memcached
  template:
    metadata:
      labels:
        app: zammad-memcached
    spec:
      containers:
      - name: memcached
        image: {{ index .Values "zammad-infra" "memcached" "image" }}
        command: ["memcached", "-m", {{ quote (index .Values "zammad-infra" "memcached" "maxMemory") }}]
        ports:
        - containerPort: 11211
        resources:
          requests:
            cpu: {{ index .Values "zammad-infra" "memcached" "resources" "requests" "cpu" }}
            memory: {{ index .Values "zammad-infra" "memcached" "resources" "requests" "memory" }}
          limits:
            cpu: {{ index .Values "zammad-infra" "memcached" "resources" "limits" "cpu" }}
            memory: {{ index .Values "zammad-infra" "memcached" "resources" "limits" "memory" }}
        readinessProbe:
          tcpSocket:
            port: 11211
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-memcached
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: zammad-memcached
  ports:
  - port: 11211
    targetPort: 11211
---
# Elasticsearch
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-elasticsearch
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zammad-elasticsearch
  template:
    metadata:
      labels:
        app: zammad-elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: {{ index .Values "zammad-infra" "elasticsearch" "image" }}
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: {{ index .Values "zammad-infra" "elasticsearch" "javaOpts" }}
        ports:
        - containerPort: 9200
        resources:
          requests:
            cpu: {{ index .Values "zammad-infra" "elasticsearch" "resources" "requests" "cpu" }}
            memory: {{ index .Values "zammad-infra" "elasticsearch" "resources" "requests" "memory" }}
          limits:
            cpu: {{ index .Values "zammad-infra" "elasticsearch" "resources" "limits" "cpu" }}
            memory: {{ index .Values "zammad-infra" "elasticsearch" "resources" "limits" "memory" }}
        volumeMounts:
        - name: data
          mountPath: /usr/share/elasticsearch/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: zammad-elasticsearch-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-elasticsearch
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: zammad-elasticsearch
  ports:
  - port: 9200
    targetPort: 9200
---
# Zammad Init Job
apiVersion: batch/v1
kind: Job
metadata:
  name: zammad-init
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: zammad-init
        image: {{ index .Values "zammad-app" "image" }}
        args: ["zammad-init"]
        envFrom:
        - configMapRef:
            name: zammad-config
        volumeMounts:
        - name: storage
          mountPath: /opt/zammad/storage
        - name: backup
          mountPath: /var/tmp/zammad
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: zammad-storage-pvc
      - name: backup
        persistentVolumeClaim:
          claimName: zammad-backup-pvc
{{- end }}
